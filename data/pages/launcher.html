<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../icons/icon.ico" type="image/x-icon">
<link rel="shortcut icon" href="../icons/icon.ico" type="image/x-icon">
<title>PCMod Launcher</title>
<style>
/* Modern Card-Style Responsive Design */
* {
  box-sizing: border-box;
}

body {
  background: url(../icons/dirt.png) repeat 0 0;
  background-color: #121926;
  color: #e2e8f0;
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
  margin: 0;
  padding: 12px;
  overflow: hidden;
  height: 100vh;
  user-select: none;
}

/* Base Card Styling */
.card {
  background: rgba(24, 35, 54, 0.88);
  backdrop-filter: blur(8px);
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  padding: 10px 12px;
  margin-bottom: 10px;
}

.card-title {
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #94a3b8;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  padding-bottom: 6px;
  margin-bottom: 8px;
  text-align: center;
}

/* Layout Grid */
.container {
  display: grid;
  grid-template-columns: 210px 1fr 220px;
  gap: 12px;
  height: calc(100vh - 28px);
}

.column-left, .column-right {
  display: flex;
  flex-direction: column;
}

.column-center {
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* Left Column Styling */
.tasks-card {
  flex: 0 0 auto;
}

.players-card {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
}

.btn-card {
  width: 100%;
  background: #2a3d58;
  color: #f1f5f9;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 6px;
  padding: 8px;
  margin-bottom: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: center;
}

.btn-card:hover {
  background: #3b5278;
  border-color: #60a5fa;
  transform: translateY(-1px);
}

.btn-card:active {
  transform: translateY(0);
}

#online {
  flex: 1;
  background: rgba(0, 0, 0, 0.25);
  border-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  padding: 8px;
  font-size: 13px;
  overflow-y: auto;
  margin: 0;
  color: #cbd5e1;
}

/* Right Column Styling */
.settings-card {
  flex: 1 1 auto;
  font-size: 12px;
}

.settings-table {
  width: 100%;
  border-collapse: collapse;
}

.settings-table td {
  padding: 4px 0;
}

.settings-label {
  color: #cbd5e1;
  font-size: 12px;
}

input.largerCheckbox {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: #3b82f6;
}

select, input[type="text"], input[type="password"], input[type="number"] {
  background: rgba(15, 23, 42, 0.8);
  color: #f8fafc;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 4px;
  padding: 4px 6px;
  outline: none;
  font-size: 12px;
  width: 100%;
}

select:focus, input:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
}

.login-card {
  flex: 0 0 auto;
}

/* Center Column Styling */
.logo-container {
  text-align: center;
  margin-bottom: 8px;
}

.logo-img {
  height: 80px;
  filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
}

.main-card {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 12px;
}

.news-frame {
  flex: 1;
  width: 100%;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 6px;
  background: #0f172a;
  margin-bottom: 12px;
}

.action-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.btn-launch {
  background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
  color: #ffffff;
  border: 1px solid #22c55e;
  border-radius: 8px;
  height: 65px;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(22, 163, 74, 0.4);
  transition: all 0.2s ease;
}

.btn-launch:hover {
  background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(34, 197, 94, 0.5);
}

.btn-update {
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  border: 1px solid #3b82f6;
  border-radius: 8px;
  height: 65px;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
  transition: all 0.2s ease;
}

.btn-update:hover {
  background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
}

.version-bar {
  text-align: right;
  font-size: 12px;
  color: #94a3b8;
  padding-top: 4px;
}
</style>
</head>
<body>

<div class="container">
  <!-- LEFT COLUMN -->
  <div class="column-left">
    <!-- Tasks/Links Card -->
    <div class="card tasks-card">
      <div class="card-title">Tasks / Links</div>
      <button class="btn-card" id="ML" onclick="openModlist()">Modlist<br><span style="font-size:11px; font-weight:normal;">(<span id="modcount">--</span> mods)</span></button>
      <button class="btn-card" onclick="openWeb('pcmod')">PCMod Website</button>
      <button class="btn-card" onclick="openWeb('discord')">Join Discord</button>
      <button class="btn-card" onclick="openWeb('auth')">My Account</button>
    </div>

    <!-- Players Online Card -->
    <div class="card players-card">
      <div class="card-title">Players Online</div>
      <button class="btn-card" style="padding: 4px; font-size: 11px; margin-bottom: 8px;" onclick="refreshPlayers()">Refresh</button>
      <div id="online">Loading...</div>
    </div>
  </div>

  <!-- CENTER COLUMN -->
  <div class="column-center">
    <div class="logo-container">
      <img class="logo-img" src="../icons/pcmod.png" alt="PCMod Logo">
    </div>

    <div class="card main-card">
      <iframe id="news" class="news-frame" title="PCMod News" name="PCMod News" src="news.html"></iframe>

      <div class="action-buttons">
        <button class="btn-launch" onclick="launchGame()">LAUNCH</button>
        <button class="btn-update" onclick="runUpdate()">UPDATE</button>
      </div>
    </div>

    <div class="version-bar" id="version">-.-.-</div>
  </div>

  <!-- RIGHT COLUMN -->
  <div class="column-right">
    <!-- Settings Card -->
    <div class="card settings-card">
      <div class="card-title">Settings</div>
      <table class="settings-table">
        <tr>
          <td class="settings-label"><label for="Shortcut">Shortcut</label></td>
          <td align="right"><input class="largerCheckbox" title="Creates a shortcut on your desktop." type="checkbox" id="Shortcut" onclick="toggleShortcut()"></td>
        </tr>
        <tr>
          <td class="settings-label"><label for="AutoServer">Auto Server</label></td>
          <td align="right"><input class="largerCheckbox" title="Launch into the server." type="checkbox" id="AutoServer" onclick="toggleAutoServer()"></td>
        </tr>
        <tr>
          <td class="settings-label"><label for="LL">Log Logins</label></td>
          <td align="right"><input class="largerCheckbox" title="Keeps track of how often you play." type="checkbox" id="LL" onclick="toggleLogLogins()"></td>
        </tr>
        <tr>
          <td class="settings-label"><label for="LT">Lite Mode</label></td>
          <td align="right"><input class="largerCheckbox" title="Removes client side mods." type="checkbox" id="LT" onclick="toggleLiteMode()"></td>
        </tr>
        <tr>
          <td class="settings-label"><label for="ShowConsole">Console</label></td>
          <td align="right"><input class="largerCheckbox" title="Show/Hide the python console window." type="checkbox" id="ShowConsole" onclick="toggleShowConsole()"></td>
        </tr>
        <tr>
          <td class="settings-label"><label for="VERSION-select">Version</label></td>
          <td align="right">
            <select title="Select Previous versions of the game." name="version-select" id="VERSION-select" style="width: 100px;" onchange="changeVersion()"></select>
          </td>
        </tr>
        <tr>
          <td class="settings-label"><label for="MEM">Memory</label></td>
          <td align="right">
            <input title="Sets Memory Allocated to game in MB." value="4096" type="number" style="width: 70px;" id="MEM" onchange="changeMemory()">
          </td>
        </tr>
      </table>

      <div style="margin-top: 10px; display: flex; gap: 6px;">
        <button class="btn-card" style="font-size: 11px; padding: 6px;" onclick="saveSettingsButton()">Save</button>
        <button class="btn-card" style="font-size: 11px; padding: 6px;" onclick="launchServer()">Launch Server</button>
      </div>
    </div>

    <!-- Login Card -->
    <div class="card login-card">
      <div class="card-title">Login</div>
      <table class="settings-table">
        <tr>
          <td style="width: 40px; color: #cbd5e1;">User</td>
          <td><input type="text" id="user" placeholder="Username" value="Loading..."></td>
        </tr>
        <tr>
          <td style="color: #cbd5e1;">Pass</td>
          <td><input type="password" id="pass" placeholder="Password"></td>
        </tr>
      </table>

      <div style="margin-top: 8px;">
        <button class="btn-card" style="background: #3b82f6; font-size: 12px; padding: 6px;" onclick="login()">Login</button>
      </div>
      <div id="login-status" style="font-size: 11px; text-align: center; margin-top: 4px; color: #94a3b8;"></div>
    </div>
  </div>
</div>

<script>
// Pure ES5/IE11 Compatible JavaScript Bridge for WebViews
var isInitialized = false;

function initLauncher() {
    if (!window.pywebview || !window.pywebview.api) return;
    window.pywebview.api.init_launcher().then(function(data) {
        if (!data) return;

        // 1. Set username
        document.getElementById('user').value = data.user || "";

        // 2. Load Settings checkboxes & inputs
        document.getElementById('Shortcut').checked = (data.settings.shortcut === "1");
        document.getElementById('AutoServer').checked = (data.settings.autoserver === "1");
        document.getElementById('LL').checked = (data.settings['log-logins'] === "1" || data.settings.log_logins === "1");
        document.getElementById('LT').checked = (data.settings.lite === "1");
        document.getElementById('ShowConsole').checked = (data.settings.showconsole === "1");
        document.getElementById('MEM').value = data.settings.memory || "4096";

        // 3. Set Mod Count
        document.getElementById('modcount').innerHTML = data.modcount || "--";

        // 4. Set Version Text
        document.getElementById('version').innerHTML = "Launcher: " + data.launcher_version + " / Pack: " + data.pack_version;

        // 5. Populate Versions Select dropdown
        var select = document.getElementById('VERSION-select');
        select.innerHTML = "";
        for (var i = 0; i < data.versions_list.length; i++) {
            var v = data.versions_list[i];
            var opt = document.createElement('option');
            opt.value = i + " " + v.name;
            opt.text = v.name;
            if (v.name === data.settings.pack) {
                opt.selected = true;
            }
            select.add(opt);
        }

        // 6. Set Online Players
        document.getElementById('online').innerHTML = data.online_players || "No players online";
    });
}

// Robust Polling for pywebview API to ensure it initializes safely on all WebView engines
var initInterval = setInterval(function() {
    if (window.pywebview && window.pywebview.api && !isInitialized) {
        clearInterval(initInterval);
        isInitialized = true;
        initLauncher();
    }
}, 100);

window.addEventListener('pywebviewready', function() {
    clearInterval(initInterval);
    if (!isInitialized) {
        isInitialized = true;
        initLauncher();
    }
});

function openModlist() {
    if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.open_modlist();
    }
}

function openWeb(site) {
    if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.open_web(site);
    }
}

function refreshPlayers() {
    document.getElementById('online').innerHTML = "Refreshing...";
    if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.refresh_players().then(function(html) {
            document.getElementById('online').innerHTML = (html && html.trim() !== "") ? html : "No Players Online";
        });
    }
}

function toggleShowConsole() {
    var val = document.getElementById('ShowConsole').checked ? "1" : "0";
    if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.set_setting('showconsole', val);
    }
}

function login() {
    var u = document.getElementById('user').value;
    var p = document.getElementById('pass').value;
    var statusElem = document.getElementById('login-status');
    if (statusElem) {
        statusElem.style.color = "#94a3b8";
        statusElem.innerHTML = "Logging in...";
    }
    if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.login(u, p).then(function(res) {
            if (res) {
                if (statusElem) {
                    if (res.status === "success") {
                        statusElem.style.color = "#4ade80";
                        statusElem.innerHTML = "Logged In Successfully.";
                    } else if (res.auth === "401.auth") {
                        statusElem.style.color = "#f87171";
                        statusElem.innerHTML = "Password incorrect. Try again.";
                    } else {
                        statusElem.style.color = "#f87171";
                        statusElem.innerHTML = "Login failed: " + res.auth;
                    }
                }
                if (res.status === "success") {
                    initLauncher();
                }
            }
        });
    }
}

function toggleShortcut() {
    var val = document.getElementById('Shortcut').checked ? "1" : "0";
    if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.set_setting('shortcut', val);
    }
}

function toggleAutoServer() {
    var val = document.getElementById('AutoServer').checked ? "1" : "0";
    if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.set_setting('autoserver', val);
    }
}

function toggleLogLogins() {
    var val = document.getElementById('LL').checked ? "1" : "0";
    if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.set_setting('log-logins', val);
    }
}

function toggleLiteMode() {
    var val = document.getElementById('LT').checked ? "1" : "0";
    if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.set_lite_mode(val).then(function() {
            initLauncher();
        });
    }
}

function changeMemory() {
    var val = document.getElementById('MEM').value;
    if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.set_memory(val).then(function() {
            initLauncher();
        });
    }
}

function changeVersion() {
    var select = document.getElementById('VERSION-select');
    var val = select.value;
    if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.set_version_select(val).then(function() {
            initLauncher();
        });
    }
}

function saveSettingsButton() {
    if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.save_settings_btn();
    }
}

function launchServer() {
    if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.launch_server();
    }
}

function launchGame() {
    if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.launch_game();
    }
}

function runUpdate() {
    if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.run_update();
    }
}
</script>
</body>
</html>
